[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glpi-impact"
version = "0.2.0"
description = "Browser-backed toolkit for GLPI Impact automation and reverse engineering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55",
    "requests>=2.32",
    "beautifulsoup4>=4.13",
    "pydantic>=2.11",
    "loguru>=0.7",
    "pandas>=2.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
